[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "charge-ai-agent"
version = "0.1.0"
description = "A small durable execution engine with explicit recovery semantics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic-settings>=2.6,<3", "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

name: correctness
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: mypy src tests scripts
      - name: Start PostgreSQL 16
        run: docker compose up -d --wait db
      - name: Actual PostgreSQL and SIGKILL tests
        run: pytest -q
      - name: Build and exercise the submitted Docker setup
        run: python scripts/demo.py
      - name: Diagnostic logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
